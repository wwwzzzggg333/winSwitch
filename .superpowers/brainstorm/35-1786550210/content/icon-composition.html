<h2>选择 winSwitch 的无底板构图</h2>
<p class="subtitle">三种方案都采用蓝紫渐变、叠放窗口和切换意象。请重点观察 32px 左右时是否仍然清晰。</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image" style="display:grid;place-items:center;min-height:230px">
      <svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="双窗口环形切换">
        <defs><linearGradient id="ga" x1="28" y1="24" x2="150" y2="156" gradientUnits="userSpaceOnUse"><stop stop-color="#35B8FF"/><stop offset="1" stop-color="#7657FF"/></linearGradient></defs>
        <rect x="30" y="38" width="86" height="68" rx="13" fill="none" stroke="url(#ga)" stroke-width="12"/>
        <path d="M65 78h68a16 16 0 0 1 16 16v43a16 16 0 0 1-16 16H63a16 16 0 0 1-16-16v-12" fill="none" stroke="url(#ga)" stroke-width="12" stroke-linecap="round"/>
        <path d="M121 111h25m0 0-12-12m12 12-12 12" fill="none" stroke="url(#ga)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="card-body"><h3>A · 环形切换</h3><p>两个窗口前后叠放，箭头沿右下方流动；功能表达最直接，我的推荐。</p></div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image" style="display:grid;place-items:center;min-height:230px">
      <svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="错位双窗闪切">
        <defs><linearGradient id="gb" x1="25" y1="20" x2="155" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#36C5FF"/><stop offset="1" stop-color="#754BFF"/></linearGradient></defs>
        <path d="M28 53a15 15 0 0 1 15-15h78a15 15 0 0 1 15 15v48H43a15 15 0 0 1-15-15V53Z" fill="none" stroke="url(#gb)" stroke-width="12" stroke-linejoin="round"/>
        <path d="M53 82h84a15 15 0 0 1 15 15v36a15 15 0 0 1-15 15H59a15 15 0 0 1-15-15v-42" fill="none" stroke="url(#gb)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="m70 112 15-15m0 0H70m15 0v15m25 4 15 15m0 0v-15m0 15h-15" fill="none" stroke="url(#gb)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="card-body"><h3>B · 闪切双窗</h3><p>对角箭头强调“来回切换”，动感较强，但小尺寸的线条稍多。</p></div>
  </div>

  <div class="card" data-choice="c" onclick="toggleSelect(this)">
    <div class="card-image" style="display:grid;place-items:center;min-height:230px">
      <svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="抽象重叠窗口">
        <defs><linearGradient id="gc" x1="31" y1="27" x2="151" y2="153" gradientUnits="userSpaceOnUse"><stop stop-color="#2EC7FF"/><stop offset="1" stop-color="#8050FF"/></linearGradient></defs>
        <rect x="27" y="35" width="94" height="78" rx="16" fill="none" stroke="url(#gc)" stroke-width="13"/>
        <rect x="59" y="68" width="94" height="78" rx="16" fill="none" stroke="url(#gc)" stroke-width="13"/>
        <path d="m76 132-15 15-15-15M134 51l15-15 15 15" fill="none" stroke="url(#gc)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="card-body"><h3>C · 极简重叠</h3><p>符号感最强、轮廓最干净，适合任务栏；箭头含义更抽象。</p></div>
  </div>
</div>

<p class="subtitle">点击卡片即可选择；也可以在对话中回复 A、B 或 C。</p>
