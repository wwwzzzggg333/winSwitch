name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.8.0"

jobs:
  build:
    name: Build (mySwitcher-windows-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $packageName = "mySwitcher-windows-x64"
          $outDir = "packages/$packageName"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          if (Test-Path "build/Release/mySwitcher.exe") {
            $exe = "build/Release/mySwitcher.exe"
          } elseif (Test-Path "build/mySwitcher.exe") {
            $exe = "build/mySwitcher.exe"
          } else {
            throw "mySwitcher.exe not found"
          }

          Copy-Item $exe "$outDir/mySwitcher.exe"
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler "$outDir/mySwitcher.exe"
          Copy-Item README.md $outDir/
          Compress-Archive -Path $outDir -DestinationPath "packages/$packageName.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-mySwitcher-windows-x64
          path: packages/mySwitcher-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
