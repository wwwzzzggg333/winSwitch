name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.8.0"

jobs:
  build:
    name: Build (winSwitch-windows-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $packageName = "winSwitch-windows-x64"
          $outDir = "packages/$packageName"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          if (Test-Path "build/Release/winSwitch.exe") {
            $exe = "build/Release/winSwitch.exe"
          } elseif (Test-Path "build/winSwitch.exe") {
            $exe = "build/winSwitch.exe"
          } else {
            throw "winSwitch.exe not found"
          }

          Copy-Item $exe "$outDir/winSwitch.exe"
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler "$outDir/winSwitch.exe"
          Copy-Item README.md $outDir/
          Compress-Archive -Path $outDir -DestinationPath "packages/$packageName-portable.zip"

          cmake --build build --config Release --target package
          $installer = Get-Item "build/winSwitch-*-windows-x64.exe"
          ./tests/verify_windows_installer.ps1 -InstallerPath $installer.FullName
          Copy-Item $installer.FullName "packages/$($installer.BaseName)-setup.exe"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-winSwitch-windows-x64
          path: |
            packages/winSwitch-windows-x64-portable.zip
            packages/winSwitch-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
